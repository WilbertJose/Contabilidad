<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Contable Automático</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Sistema Contable</h1>

        <div class="section-card input-section">
            <input type="text" id="input-operacion" placeholder="Escriba su registro: ">
            <button id="btn-registrar" class="btn primary">Registrar</button>
        </div>

        <div class="section-card">
            <h2>Libro Diario</h2>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Cuenta</th>
                        <th>Debe</th>
                        <th>Haber</th>
                    </tr>
                </thead>
                <tbody id="diario-body">
                    </tbody>
                <tfoot id="diario-foot">
                    </tfoot>
            </table>
        </div>

        <div class="section-card">
            <h2>Cuentas T (Libro Mayor)</h2>
            <div class="mayor-grid" id="mayor-grid">
                </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
